# cargo-deny policy (M11 Phase D). Run: cargo deny check licenses bans advisories sources
# Only the shipped target matters: Linux/macOS-only dependencies of Tauri are not in the release.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
# Permissive licenses only. MPL-2.0 is file-level copyleft: fine for unmodified dependencies.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list is the policy (ISC, LLVM-exception may appear later); not every entry is in use today.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are common in the Tauri tree; report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# RustSec database; unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"
