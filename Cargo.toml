[workspace]
resolver = "2"
members = [
    "crates/seq-core",
    "crates/clock-in",
    "crates/resolume-client",
    "crates/seq-app",
    "tools/resolume-probe",
    "tools/mock-resolume",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
seq-core = { path = "crates/seq-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde"] }
