[package]
name = "resolume-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Milestone 0: explores a running Resolume's REST, WebSocket and OSC APIs and records findings"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
rosc = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
