[package]
name = "seq-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resolume clip sequencer: engine, storage, UI server"

[dependencies]
seq-core.workspace = true
clock-in = { path = "../clock-in" }
resolume-client = { path = "../resolume-client" }
serde.workspace = true
uuid = { workspace = true, features = ["v4"] }
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap.workspace = true
env_filter = "2"
log.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
# Desktop shell (M12 Phase D), only with the `desktop` feature.
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
# The desktop shell (Tauri, M12 Phase D). Without it the binary is headless only.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-window-state",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
env_logger.workspace = true
futures-util = "0.3"
tokio-tungstenite = "0.24"
tempfile.workspace = true
mock-resolume = { path = "../../tools/mock-resolume" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
