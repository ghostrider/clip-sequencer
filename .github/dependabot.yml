# Dependency updates (M11 Phase H5): weekly, minor and patch updates grouped into one PR per ecosystem,
# major updates as their own PRs. The FFGL SDK submodule stays pinned on purpose (no gitsubmodule entry).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(actions)"
