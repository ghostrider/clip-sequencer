name: Feature request
description: An idea for something the sequencer should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The situation in your show or workflow, and what's hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea, if you have one. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
