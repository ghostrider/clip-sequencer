# Project site and user manual on GitHub Pages (M11 Phase I5). Deployed when a release is published, so the manual
# always matches the latest release; "Run workflow" redeploys it (from the latest release tag, or from main for a
# manual-only fix). Built with site/build.mjs (mdBook + landing pages).
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      from_main:
        description: Build from main instead of the latest release tag
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  # sha256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz (official release asset)
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Which version to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          FROM_MAIN: ${{ inputs.from_main }}
        run: |
          if [ "$EVENT" = "release" ]; then ref="$RELEASE_TAG"
          elif [ "$FROM_MAIN" = "true" ]; then ref="main"
          else ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          [ -n "$ref" ] || { echo "no published release yet"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building the site from $ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install mdBook (official release binary, checksum verified)
        run: |
          curl -sSLf -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site (version footer from Cargo.toml)
        run: node site/build.mjs --release
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
