# Continuous integration (M11 Phase I1). The job names are the required status checks of the protect-main ruleset:
# rust, web, deny, ffgl, site. Third-party actions are pinned to commit SHAs (Dependabot keeps them current).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4
  # sha256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz (official release asset)
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version consistency
        run: node scripts/check-version.mjs
      - name: Build the UI (embedded in the binary)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable toolchain)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

  deny:
    # cargo-deny-action is a container action: Linux runner. deny.toml checks the Windows target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans advisories sources

  ffgl:
    # Builds the plugin and its tests with MSVC and checks the static C++ runtime. The tests need an OpenGL
    # context with a GPU, which the hosted runner doesn't have, so they are built here and run on a real machine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count
          submodules: true # FFGL SDK (external/ffgl)
      - name: Build SeqView (Release x64) and its tests
        shell: pwsh
        run: ./ffgl/build.ps1 -Configuration Release -Tests -CheckDependencies

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install mdBook (official release binary, checksum verified)
        run: |
          curl -sSLf -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and check the site (links, no external requests)
        run: node site/build.mjs --release
